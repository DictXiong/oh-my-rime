name: Configuration and Lua checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 shellcheck jq busybox librime-bin
      - name: Check shell and Lua syntax
        run: |
          shellcheck update_dict.sh update_patch.sh
          find lua -name '*.lua' -exec luac5.4 -p {} \;
      - name: Run Lua regressions
        run: lua5.4 tests/lua_regression.lua
      - name: Test updates without network access
        run: python3 tests/test_updates.py
      - name: Deploy without private files
        run: python3 tests/check_deployment.py
